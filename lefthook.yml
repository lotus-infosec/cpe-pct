# Install once: npx lefthook install
pre-commit:
  parallel: false
  commands:
    branch-guard:
      run: |
        b=$(git symbolic-ref --short HEAD 2>/dev/null || echo detached)
        if [ "$b" = "main" ]; then echo "Refusing to commit on main. Use dev or a feature branch."; exit 1; fi
    gitleaks:
      run: gitleaks protect --staged --redact --verbose
    private-files:
      run: |
        if git diff --cached --name-only | grep -E '^(CLAUDE\.md|CPETracker/|imports/|data/|.*\.csv$)'; then
          echo "Private file staged. Unstage it."; exit 1; fi
    typecheck:
      glob: '*.{ts,tsx}'
      run: npx tsc --noEmit
pre-push:
  commands:
    gitleaks-history:
      run: |
        if git rev-parse -q --verify origin/main >/dev/null; then
          gitleaks detect --redact --log-opts="origin/main..HEAD"
        else
          gitleaks detect --redact
        fi
