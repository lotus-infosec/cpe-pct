# Every action is pinned to a commit SHA (VERIFY A14). Never use pull_request_target.
name: security
on:
  pull_request:
  push:
    branches: [main, dev, demo]
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # gitleaks-action lists the PR's commits on pull_request events
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm audit --audit-level=high
  private-file-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          if git ls-files | grep -E '^(CLAUDE\.md|CPETracker/|imports/|data/|.*\.csv$)'; then
            echo "Private file tracked in git"; exit 1; fi
  # Aggregate job. Branch protection requires the single check named "security".
  security:
    needs: [gitleaks, audit, private-file-guard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "gitleaks=${{ needs.gitleaks.result }} audit=${{ needs.audit.result }} private-file-guard=${{ needs.private-file-guard.result }}"
          test "${{ needs.gitleaks.result }}" = success
          test "${{ needs.audit.result }}" = success
          test "${{ needs.private-file-guard.result }}" = success
