        title: Microsoft Certification Renewal (page updated 2025-01-14)
        retrieved_on: 2026-09-12
        pointer: 'renewals free; six-month window; pass the online unproctored assessment before expiry; extended one year from the expiration date; Fundamentals do not expire'
    notes: >-
      One-year validity for associate, expert, and specialty certifications; renew free by passing the online
      assessment any time in the six months before expiry (recert_exam). On success the certification extends
      one year from its expiration date. Fundamentals certifications never expire. No fee.

