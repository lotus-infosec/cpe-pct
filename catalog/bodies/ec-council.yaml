      name: Computer Hacking Forensic Investigator,
      abbreviation: CHFI,
      credit_unit_label: ECE,
      expires: true,
    }
  - {
      id: ec-council/cnd,
      name: Certified Network Defender,
      abbreviation: CND,
      credit_unit_label: ECE,
      expires: true,
    }
  - {
      id: ec-council/ecih,
      name: EC-Council Certified Incident Handler,
      abbreviation: ECIH,
      credit_unit_label: ECE,
      expires: true,
    }
  - {
      id: ec-council/cpent,
      name: Certified Penetration Testing Professional,
      abbreviation: CPENT,
      credit_unit_label: ECE,
      expires: true,
    }
  - {
      id: ec-council/csa,
      name: Certified SOC Analyst,
      abbreviation: CSA,
