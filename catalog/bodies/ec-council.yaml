      name: Certified Chief Information Security Officer,
      abbreviation: CCISO,
      credit_unit_label: ECE,
      expires: true,
    }

versions:
  - version: 1
    effective_from: 2016-01-01
    verified_on: 2026-09-12
    sources:
      - url: https://cert.eccouncil.org/ece-policy.html
        title: EC-Council Continuing Education (ECE) Policy
        retrieved_on: 2026-09-12
        pointer: 'certifications under the policy (ECIH listed); 120 credits per certification per three years; credit table; suspension then revocation after 12 months'
      - url: https://store.eccouncil.org/product/ece-annual-continuing-education-fees/
        title: EC-Council Store — ECE Annual Continuing Education (CE) Fees
        retrieved_on: 2026-09-12
        pointer: '$80.00, Annual Continuing Education (CE) Fees for 1 year'
    notes: >-
      120 ECE credits per certification within three years; credits are registered by 1 February annually.
      Annual CE fee $80 per member (policy: USD 80 with at least one certificate under the policy; the store
      lists the same amount). The CCISO candidate handbook v6.1 (2025) mentions $100 — the store price is used
      (VERIFY B5). Activity values are per item, not per hour: education course 1 per course, seminar/conference
      1 per event, presentation 3, article/chapter/white paper 20, book 100, authoring a course 40, teaching a new
      course 21 (upgrade 11), reading 5 per item, IT-security certification exam 40, higher education 15 per
      semester / 10 per quarter, volunteering 1 per activity. No per-activity maxima are published.

