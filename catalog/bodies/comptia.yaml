        title: CompTIA CE Program FAQ
        retrieved_on: 2026-09-11
        pointer: 'renewing the highest-level cert automatically renews lower-level certs; fees only for highest'
    notes: >-
      No annual minimum. CE fee is per 3-year cycle, due by the expiration date (encoded period_months 36);
      covered_by_higher_cert reflects 'only pay for your highest-level certification'. Hours-to-CEU is
      '1 CEU per hour' with no statement on fractions; rounding encoded exact (VERIFY C-item: check portal).
      Blog posts (1 CEU) and work experience (3 CEUs/yr) have no canonical activity type and are not encoded.
      CSAP (stackable) has no CE of its own; modelled as requires_current on Security+ and CySA+
      (secondary sources only — CompTIA's stackables page does not state renewal rules; VERIFY B2).
      credits_flow_down mirrors 'renewing the highest cert renews the lower ones'; portal behaviour
      of CEUs cascading is VERIFY C2.

