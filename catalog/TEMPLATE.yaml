# catalog/bodies/<body>.yaml — TEMPLATE
# Rules are DATA. Every number needs a source. Versions are append-only.
# Legal: parameters only. Never paste handbook prose. body_label is the issuer's short name for an activity, nothing longer.

schema: 1

body:
  id: example # slug, used as bodies.id
  name: Example Body
  website: https://example.org
  fee_scope: membership # membership | certification | none

certifications:
  - id: example/cert-a # "<body>/<slug>"
    name: Example Certification A
    abbreviation: ECA
    credit_unit_label: CPE
    expires: true
  - id: example/cert-b
    name: Example Certification B
    abbreviation: ECB
    credit_unit_label: CPE
    expires: false # lifetime cert: still listed so it appears on the dashboard

versions:
  - version: 1
    effective_from: 2024-01-01
    verified_on: 2026-09-12
    sources:
      - url: https://example.org/policy.pdf
        title: Example CPE Policy
        retrieved_on: 2026-09-12
        sha256: '<sha256 of the retrieved document>'
        pointer: '§4.2, p.7' # where in the doc; never a quotation
    notes: "Free text for the encoder's caveats."

    categories:
      - key: A
        name: Domain-related
      - key: B
        name: Professional development
        # parent_key: A     # optional nesting (PMI-style sub-categories)

    requirements:
      - certification: example/cert-a
        cycle_months: 36
        total_credits: 120 # decimal allowed; compiled to hundredths
        annual_min: 40
        annual_min_severity: hard # hard | soft
        fee: { amount: 135.00, currency: USD, period_months: 12 }
      # fee options: covered_by_higher_cert: true | waived_if_other_cert_held: true

    crediting:
      # activity_type must be one of the canonical keys in src/core/domain/activity-types.ts
      - activity_type: attend_conference
        body_label: Conference attendance
        basis: per_minutes # per_minutes | per_item | fixed
        minutes_per_credit: 60
        rounding: floor_quarter # floor_quarter | floor_half | floor_whole | nearest_quarter | exact
        category: A
        cap_per_cycle: null
        cap_per_year: null
        cap_per_item: null
        evidence_required: true
        applies_to: null # null = all certs of this body, or a certification id
      - activity_type: read_book
        body_label: Reading
        basis: per_item
        credits_per_item: 5
        category: A

    constraints:
      # types: cycle_total | annual_min | category_min | category_max | activity_type_max |
      #        fee_paid | prerequisite_current | attestation | recert_exam | any_of
      - type: cycle_total
      - type: annual_min
        severity: hard
      - type: category_max
        params: { category: B, max: 30 }
        applies_to: example/cert-a
      - type: fee_paid
      # - type: any_of
      #   params: { of: [ { type: cycle_total }, { type: recert_exam } ] }

    relations: []
      # - { from: example/cert-a, to: example/cert-b, relation: earning_renews }
      # relation: earning_renews | credits_flow_down | requires_current | earning_credits (with credits:)
