<html lang="en">

    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0d1117" />
    <!-- A password-protected, single-owner app: nothing here should be indexed or followed (STAGE10). -->
    <meta name="robots" content="noindex, nofollow" />

    <meta
      name="description"
      content="Self-hosted tracker for continuing-education credits and maintenance fees across professional certifications."
    />

    <link rel="icon" href="/favicon.png" type="image/png" sizes="96x96" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="CPE PCT" />
    <meta
      property="og:description"
      content="Self-hosted tracker for continuing-education credits and maintenance fees across professional certifications."
    />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />

    <meta name="twitter:title" content="CPE PCT" />

      rel="preload"
      href="/fonts/ibm-plex-sans-latin-wght.woff2"
      as="font"
      type="font/woff2"

      rel="preload"
